<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Menu — Eloria Brista Studio</title>
  <meta name="description" content="Navigation directory — Eloria Brista Studio." />
  
  <!-- Favicon vectorial -->
  <link rel="icon" type="image/svg+xml" href="assets/Ebs_logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      background-color: #f5f4f0;
      color: #0e0e0e;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      overflow: hidden;
    }

    /* ANIMACIÓN DE ENTRADA SUAVE */
    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: translateY(35px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-menu {
      opacity: 0;
      animation: fadeInZoom 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    /* HEADER MÍNIMO SOLO CON LOGO */
    .header-editorial {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 35px 3.5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      z-index: 100;
      background-color: rgba(245, 244, 240, 0.85);
      backdrop-filter: blur(8px);
    }

    .header-editorial .brand-logo img {
      height: 34px;
      width: auto;
      display: block;
    }

    /* CONTENEDOR ALINEADO A LA IZQUIERDA Y CENTRADO VERTICALMENTE */
    .menu-fullscreen-wrapper {
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start; /* Alineado a la izquierda */
      box-sizing: border-box;
      padding: 0 8vw; /* Margen izquierdo elegante */
    }

    .menu-inner-block {
      width: fit-content;
      text-align: left;
    }

    .directory-list {
      display: flex;
      flex-direction: column;
      gap: 10px; /* Interlineado muy compacto entre opciones principales */
    }

    .directory-item-group {
      display: flex;
      flex-direction: column;
    }

    /* ENLACES PRINCIPALES */
    .directory-link {
      font-family: 'Inter', sans-serif;
      font-size: clamp(2.5rem, 5.2vw, 4.8rem);
      font-weight: 300;
      color: #777;
      text-decoration: none;
      letter-spacing: -0.03em;
      line-height: 1.05;
      transition: color 0.25s ease, transform 0.25s ease;
      display: inline-block;
      width: fit-content;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }

    .directory-link:hover, .directory-link.active-main {
      color: #0e0e0e;
      transform: translateX(8px);
    }

    /* SUBLISTA DE PROYECTOS (INTERLÍNEA MÁS ESTRECHA Y COMPACTA) */
    .sub-projects-list {
      display: none;
      flex-direction: column;
      gap: 6px; /* Espacio mínimo y súper junto entre cada "Case" */
      margin-top: 10px;
      margin-left: 12px;
      padding-left: 20px;
      border-left: 1px solid rgba(14, 14, 14, 0.2);
    }

    .sub-projects-list.open {
      display: flex;
    }

    .sub-project-item {
      font-family: 'Inter', sans-serif;
      font-size: clamp(1.1rem, 2vw, 1.6rem);
      font-weight: 300;
      color: #666;
      text-decoration: none;
      letter-spacing: -0.02em;
      line-height: 1.15; /* Interlineado más estrecho pedido */
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .sub-project-item:hover {
      color: #0e0e0e;
      transform: translateX(6px);
    }

    @media (max-width: 768px) {
      .header-editorial { padding: 20px; }
      body, html { overflow: auto; height: auto; }
      .menu-fullscreen-wrapper { padding: 120px 20px 80px 20px; height: auto; justify-content: flex-start; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- HEADER MÍNIMO (SOLO LOGO) -->
  <header class="header-editorial">
    <a href="index.html" class="brand-logo" title="Eloria Brista Studio">
      <img src="assets/Ebs_logo.svg" alt="Eloria Brista Studio" onerror="this.onerror=null; this.src='assets/EBS_Logo.png';" />
    </a>
  </header>

  <main class="menu-fullscreen-wrapper animate-menu">
    <div class="menu-inner-block">
      <div class="directory-list">
        
        <!-- 01. HOME -->
        <div class="directory-item-group">
          <a href="index.html" class="directory-link">Home</a>
        </div>

        <!-- 02. WORK (CON DESPLEGABLE COMPACTO) -->
        <div class="directory-item-group">
          <button type="button" class="directory-link" id="workToggle" onclick="toggleWork()">Work <span>↓</span></button>
          
          <div class="sub-projects-list" id="workSubList">
            <a href="work.html" class="sub-project-item">Case 01 — Sukha</a>
            <a href="work.html" class="sub-project-item">Case 02 — Nueve Cero Nueve</a>
            <a href="work.html" class="sub-project-item">Case 03 — Hypnia</a>
            <a href="work.html" class="sub-project-item">Case 04 — Art Cover Collections</a>
            <a href="work.html" class="sub-project-item">Case 05 — Vibin: The Ambients</a>
            <a href="work.html" class="sub-project-item">Case 06 — The Human Tapes</a>
            <a href="work.html" class="sub-project-item">Case 07 — Celeste</a>
          </div>
        </div>

        <!-- 03. ABOUT -->
        <div class="directory-item-group">
          <a href="about.html" class="directory-link">About</a>
        </div>

        <!-- 04. EBBERKETT -->
        <div class="directory-item-group">
          <a href="ebberkett.html" class="directory-link">Ebberkett</a>
        </div>

        <!-- 05. CONTACT -->
        <div class="directory-item-group">
          <a href="contact.html" class="directory-link">Contact</a>
        </div>

      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    function toggleWork() {
      const subList = document.getElementById('workSubList');
      const toggleBtn = document.getElementById('workToggle');
      subList.classList.toggle('open');
      if (subList.classList.contains('open')) {
        toggleBtn.innerHTML = 'Work <span>↑</span>';
      } else {
        toggleBtn.innerHTML = 'Work <span>↓</span>';
      }
    }
  </script>
</body>
</html>
