<style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #f5f4f0;
      color: #0e0e0e;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER EDITORIAL UNIFICADO */
    .header-editorial {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 35px 4vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      z-index: 100;
      background-color: rgba(245, 244, 240, 0.9);
      backdrop-filter: blur(8px);
    }

    .header-editorial .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .header-editorial .brand-logo img {
      height: 28px;
      width: auto;
      display: block;
    }

    .header-editorial .brand-logo span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: -0.25px;
      text-transform: uppercase;
      color: #0e0e0e;
    }

    .header-editorial .brand-logo:hover { opacity: 0.5; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-links a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      color: #666;
      transition: color 0.3s ease;
    }

    .nav-links a:hover, .nav-links a.active { color: #0e0e0e; }

    /* CONTENEDOR PRINCIPAL CON ESPACIO NEGATIVO MASIVO */
    .page-container {
      padding: 210px 4vw 140px 4vw;
      max-width: 1600px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 120px; /* Gran respiro de espacio negativo */
    }

    .page-title {
      font-size: clamp(3.2rem, 6.5vw, 6.8rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      margin: 18px 0 0 0;
      line-height: 1.02;
    }

    /* MENÚ TIPOGRÁFICO DE FILTROS (ESTILO REFERENCIA) */
    .editorial-filter-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 110px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(14, 14, 14, 0.08);
      padding-bottom: 50px;
    }

    .filter-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-col span.label {
      color: #888;
      margin-bottom: 4px;
    }

    .filter-col a, .filter-col button {
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #666;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s ease;
      width: fit-content;
    }

    .filter-col a:hover, .filter-col button:hover, .filter-col button.active {
      color: #0e0e0e;
    }

    /* REJILLA DE PROYECTOS MODERNA */
    .work-grid-modern {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 90px 5vw;
    }

    .work-item-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .work-img-wrapper {
      width: 100%;
      aspect-ratio: 16 / 11;
      background-color: #e6e5e0;
      overflow: hidden;
      margin-bottom: 22px;
      position: relative;
    }

    .work-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .work-item-card:hover .work-img-wrapper img {
      transform: scale(1.03);
    }

    .work-meta-tags {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #777;
      margin-bottom: 8px;
    }

    .work-item-title {
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin: 0 0 10px 0;
      color: #0e0e0e;
    }

    .work-item-desc {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.6;
      margin: 0;
      max-width: 600px;
    }

    /* BANNER DE ARCHIVO OSCURO */
    .archive-cta-section {
      margin-top: 150px;
      background-color: #0e0e0e;
      color: #f5f4f0;
      padding: 100px 5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 40px;
      box-sizing: border-box;
    }

    .archive-cta-title {
      font-size: clamp(2.2rem, 4.5vw, 4rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      margin: 0;
    }

    .archive-cta-title em {
      font-style: italic;
      font-family: serif;
    }

    .archive-cta-content {
      max-width: 480px;
    }

    .archive-cta-content p {
      color: #b0afaa;
      margin: 0 0 28px 0;
      line-height: 1.65;
      font-size: 1.05rem;
    }

    .archive-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      color: #0e0e0e;
      background: #f5f4f0;
      padding: 14px 28px;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    .archive-btn:hover { background: #ffffff; }

    /* FOOTER */
    .redesigned-footer {
      width: 100%;
      padding: 100px 4vw 50px 4vw;
      background-color: #f5f4f0;
      border-top: 1px solid rgba(14, 14, 14, 0.1);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .footer-inner-content {
      max-width: 850px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .footer-logo-brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      color: #0e0e0e;
    }

    .footer-logo-brand img {
      height: 32px;
      width: auto;
    }

    .footer-brand-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      font-weight: 500;
      letter-spacing: -0.25px;
      text-transform: uppercase;
      margin: 0;
    }

    .footer-email-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.95rem, 1.4vw, 1.15rem);
      color: #0e0e0e;
      text-decoration: none;
      border-bottom: 1px solid rgba(14, 14, 14, 0.4);
      padding-bottom: 3px;
      transition: border-color 0.2s ease, opacity 0.2s ease;
    }

    .footer-email-link:hover { border-color: #0e0e0e; opacity: 0.6; }

    .footer-location-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #666;
      margin: 0;
    }

    .footer-social-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 10px;
    }

    .footer-social-icon {
      color: #0e0e0e;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .footer-social-icon:hover { transform: translateY(-2px); opacity: 0.65; }
    .footer-social-icon svg { width: 20px; height: 20px; fill: currentColor; }

    .footer-legal-bar {
      margin-top: 60px;
      width: 100%;
      border-top: 1px solid rgba(14, 14, 14, 0.08);
      padding-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .footer-legal-copy {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #666;
      margin: 0;
    }

    .footer-legal-subtext {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      color: #888;
      margin: 0;
      font-weight: 300;
    }

    @media (max-width: 900px) {
      .header-editorial { padding: 20px; }
      .nav-links { display: none; }
      .page-container { padding: 140px 20px 80px 20px; }
      .editorial-filter-bar { grid-template-columns: 1fr; gap: 30px; }
      .work-grid-modern { grid-template-columns: 1fr; gap: 60px; }
      .archive-cta-section { padding: 60px 20px; }
    }
  </style>
